# fly.toml app configuration file for Fly.io Free Tier
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'diet-planner-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

# Strictly bounded to single free-tier-eligible machine (shared-cpu-1x, 256MB RAM)
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  cpu_kind = 'shared'

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'
